<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overhead Scanner — browser self-test</title>
<style>
  body{ background:#0d1014; color:#e6ecf3; font:13px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif; margin:0; padding:20px 24px; }
  h1{ font-size:16px; margin:0 0 4px; }
  h2{ font-size:11px; text-transform:uppercase; letter-spacing:.9px; color:#63707f; margin:22px 0 10px; }
  p.lede{ color:#97a3b4; margin:0 0 6px; max-width:70ch; }
  #summary{ display:inline-block; padding:5px 14px; border-radius:20px; font-weight:700; margin:10px 0; }
  .good{ background:#123227; color:#35d39a; } .bad{ background:#33191c; color:#ff6b6b; }
  ul{ list-style:none; padding:0; margin:0; }
  li{ padding:3px 0; border-bottom:1px solid #1b212a; }
  li b{ font-weight:700; margin-right:8px; }
  li .p{ color:#35d39a; } li .f{ color:#ff6b6b; }
  li span.d{ color:#63707f; margin-left:8px; }
  .grid{ display:flex; flex-wrap:wrap; gap:14px; }
  .cell{ background:#141920; border:1px solid #262e3a; border-radius:9px; padding:9px; }
  .cell h3{ font-size:11px; margin:0 0 7px; color:#97a3b4; font-weight:600; }
  canvas{ display:block; max-width:290px; height:auto; background:#fff; border-radius:4px; }
</style>
</head>
<body>
<h1>Overhead Scanner — browser self-test</h1>
<p class="lede">Runs the real pipeline against a synthetic overhead capture using the browser's own
canvas, so it covers what the Node tests stub out: <code>drawImage</code> resampling,
<code>fillText</code> rendering, and the rotate/flip stage.</p>
<div id="summary">running…</div>
<h2>Assertions</h2>
<ul id="results"></ul>
<h2>Scene &amp; detection</h2>
<div class="grid" id="sceneGrid"></div>
<h2>Filters</h2>
<div class="grid" id="filterGrid"></div>

<script src="../js/util.js"></script>
<script src="../js/geometry.js"></script>
<script src="../js/imaging.js"></script>
<script>
(function () {
  'use strict';
  let pass = 0, fail = 0;
  const results = document.getElementById('results');
  function ok(name, cond, detail) {
    cond ? pass++ : fail++;
    const li = document.createElement('li');
    li.innerHTML = '<b class="' + (cond ? 'p' : 'f') + '">' + (cond ? 'PASS' : 'FAIL') + '</b>' +
                   name + (detail ? '<span class="d">' + detail + '</span>' : '');
    results.appendChild(li);
  }
  function show(where, title, canvas) {
    const d = document.createElement('div');
    d.className = 'cell';
    d.innerHTML = '<h3>' + title + '</h3>';
    d.appendChild(canvas);
    document.getElementById(where).appendChild(d);
  }

  /* ── build a page, then a scene with that page seen at an angle ── */

  const PW = 620, PH = 850;
  const page = U.canvas(PW, PH);
  (function paintPage(c) {
    c.fillStyle = '#f7f6f2'; c.fillRect(0, 0, PW, PH);
    c.fillStyle = '#b8322c';
    c.font = 'bold 44px Georgia, serif';
    c.fillText('Quarterly Report', 52, 96);
    c.fillStyle = '#1c1c1e';
    c.font = '17px Georgia, serif';
    const line = 'The overhead camera sees the page at an angle, unevenly lit.';
    for (let i = 0; i < 22; i++) c.fillText(line.slice(0, 40 + (i * 7) % 22), 52, 150 + i * 26);
    // a photo block with a smooth gradient — must not be flattened to white
    const g = c.createLinearGradient(340, 620, 566, 800);
    g.addColorStop(0, '#2f6ea8'); g.addColorStop(1, '#8fc4e8');
    c.fillStyle = g; c.fillRect(340, 620, 226, 180);
    c.strokeStyle = '#1c1c1e'; c.lineWidth = 2; c.strokeRect(52, 620, 250, 180);
  })(Imaging.ctx2d(page));

  const SW = 900, SH = 660;
  const QUAD = [{x:0.20,y:0.10},{x:0.83,y:0.17},{x:0.76,y:0.92},{x:0.13,y:0.80}];

  const scene = U.canvas(SW, SH);
  (function composite() {
    const pd = Imaging.ctx2d(page).getImageData(0, 0, PW, PH).data;
    const out = new ImageData(SW, SH), od = out.data;
    const quadPx = QUAD.map((q) => ({ x: q.x * SW, y: q.y * SH }));
    const H = Geom.homography(quadPx, [{x:0,y:0},{x:PW,y:0},{x:PW,y:PH},{x:0,y:PH}]);
    for (let y = 0; y < SH; y++) {
      for (let x = 0; x < SW; x++) {
        const o = (y * SW + x) * 4;
        const w = H[6]*(x+.5) + H[7]*(y+.5) + 1;
        const u = (H[0]*(x+.5) + H[1]*(y+.5) + H[2]) / w;
        const v = (H[3]*(x+.5) + H[4]*(y+.5) + H[5]) / w;
        let r, g, b;
        if (u >= 0 && u < PW && v >= 0 && v < PH) {
          const p = ((v | 0) * PW + (u | 0)) * 4;
          r = pd[p]; g = pd[p+1]; b = pd[p+2];
        } else { r = 26; g = 27; b = 30; }               // dark desk mat
        // One warm lamp up and to the right. Smooth inverse-square-ish falloff
        // with no clamp — a hard floor would put a crease in the illumination
        // that no low-frequency background estimate can track, and the streak
        // it leaves would be an artefact of the test scene, not the pipeline.
        const dx = (x - SW * 0.95) / SW, dy = (y + SH * 0.15) / SH;
        const k = 0.30 + 0.78 / (1 + 3.4 * (dx*dx + dy*dy));
        od[o] = r * k * 1.04; od[o+1] = g * k; od[o+2] = b * k * 0.88; od[o+3] = 255;
      }
    }
    Imaging.ctx2d(scene).putImageData(out, 0, 0);
  })();

  show('sceneGrid', 'synthetic capture (angled, one warm lamp)', clone(scene));

  /* ── detection ── */
  const found = Geom.detect(scene);
  ok('page edges detected', !!found);
  if (found) {
    let worst = 0;
    found.forEach((p, i) => {
      worst = Math.max(worst, Math.hypot((p.x - QUAD[i].x) * SW, (p.y - QUAD[i].y) * SH));
    });
    ok('corners within 2.5% of the frame', worst < SW * 0.025, worst.toFixed(1) + 'px worst');
    const ov = clone(scene);
    const c = Imaging.ctx2d(ov);
    c.strokeStyle = '#35d39a'; c.lineWidth = 4;
    c.beginPath();
    found.forEach((p, i) => (i ? c.lineTo(p.x * SW, p.y * SH) : c.moveTo(p.x * SW, p.y * SH)));
    c.closePath(); c.stroke();
    show('sceneGrid', 'detected quad', ov);
  }

  const corners = found || QUAD;

  /* ── filters ── */
  const stats = {};
  ['original', 'auto', 'color', 'gray', 'bw', 'whiteboard', 'ink', 'photo'].forEach((name) => {
    const adj = Imaging.setFilter(Imaging.newAdjust(), name);
    const t0 = performance.now();
    const out = Imaging.pipeline(scene, adj, corners, 1100);
    const ms = performance.now() - t0;
    stats[name] = measure(out);
    show('filterGrid', name + ' · ' + ms.toFixed(0) + ' ms', out);
  });

  ok('Auto lifts the paper to white',  stats.auto.paper > 240, 'paper luma ' + stats.auto.paper);
  ok('Auto evens out the lit and shadowed sides', stats.auto.spread <= 6,
     'paper level per quadrant: ' + stats.auto.quadPaper.join(', '));
  ok('Original still shows the lamp falloff', stats.original.spread > 25,
     'paper level per quadrant: ' + stats.original.quadPaper.join(', '));
  ok('Original is left alone (still dim)', stats.original.paper < 215, 'paper luma ' + stats.original.paper);
  ok('B&W output is strictly bilevel', stats.bw.levels <= 2, stats.bw.levels + ' distinct levels');
  ok('B&W keeps text — not an all-white page', stats.bw.dark > 0.02 && stats.bw.dark < 0.5,
     (stats.bw.dark * 100).toFixed(1) + '% dark pixels');
  ok('Greyscale is neutral', stats.gray.chroma < 2, 'mean chroma ' + stats.gray.chroma.toFixed(2));
  ok('Auto preserves the red heading', stats.auto.chroma > 6, 'mean chroma ' + stats.auto.chroma.toFixed(2));

  /* ── geometry stage on a real canvas ── */
  {
    const a = Object.assign(Imaging.newAdjust(), { rotate: 90 });
    const r = Imaging.pipeline(scene, a, corners, 700);
    const s = Imaging.pipeline(scene, Imaging.newAdjust(), corners, 700);
    ok('rotate 90° swaps the output dimensions',
       Math.abs(r.width - s.height) <= 1 && Math.abs(r.height - s.width) <= 1,
       s.width + '×' + s.height + ' → ' + r.width + '×' + r.height);

    const f = Imaging.pipeline(scene, Object.assign(Imaging.newAdjust(), { flipH: true }), corners, 700);
    const left = colAvg(s, 0.12), right = colAvg(s, 0.88);
    const fleft = colAvg(f, 0.12), fright = colAvg(f, 0.88);
    ok('flip H mirrors the content', Math.abs(left - fright) < 12 && Math.abs(right - fleft) < 12,
       'L/R ' + left.toFixed(0) + '/' + right.toFixed(0) + ' → ' + fleft.toFixed(0) + '/' + fright.toFixed(0));

    const st = Imaging.pipeline(scene, Object.assign(Imaging.newAdjust(), { straighten: 8 }), corners, 700);
    ok('straighten grows the canvas to fit the rotation', st.width > s.width && st.height > s.height,
       s.width + '×' + s.height + ' → ' + st.width + '×' + st.height);
  }

  const el = document.getElementById('summary');
  el.textContent = pass + ' passed, ' + fail + ' failed';
  el.className = fail ? 'bad' : 'good';

  /* ── helpers ── */
  function clone(c) {
    const o = U.canvas(c.width, c.height);
    Imaging.ctx2d(o).drawImage(c, 0, 0);
    return o;
  }
  function colAvg(c, frac) {
    const x = Math.round(frac * (c.width - 1));
    const d = Imaging.ctx2d(c).getImageData(x, 0, 1, c.height).data;
    let s = 0;
    for (let i = 0; i < d.length; i += 4) s += d[i] * .2126 + d[i+1] * .7152 + d[i+2] * .0722;
    return s / (d.length / 4);
  }
  function measure(c) {
    const d = Imaging.ctx2d(c).getImageData(0, 0, c.width, c.height).data;
    const levels = new Set();
    let dark = 0, n = 0, chroma = 0;
    const paperHist = new Int32Array(256);
    // Per-quadrant histograms. Comparing quadrant *means* would mostly measure
    // where the heading and the photo happen to sit; comparing each quadrant's
    // paper level isolates the lighting, which is what we actually care about.
    const quad = [new Int32Array(256), new Int32Array(256), new Int32Array(256), new Int32Array(256)];
    const qn = [0, 0, 0, 0];
    // ignore a 6% border — the warp's white fill and any desk fringe live there
    const mx = Math.round(c.width * 0.06), my = Math.round(c.height * 0.06);
    for (let y = 0; y < c.height; y++) {
      for (let x = 0; x < c.width; x++) {
        const p = (y * c.width + x) * 4;
        const r = d[p], g = d[p+1], b = d[p+2];
        const lum = Math.min(255, (r * .2126 + g * .7152 + b * .0722) | 0);
        n++;
        if (levels.size <= 4) levels.add(r);
        if (lum < 128) dark++;
        chroma += (Math.max(r, g, b) - Math.min(r, g, b));
        paperHist[lum]++;
        if (x >= mx && y >= my && x < c.width - mx && y < c.height - my) {
          const q = (x < c.width / 2 ? 0 : 1) + (y < c.height / 2 ? 0 : 2);
          quad[q][lum]++; qn[q]++;
        }
      }
    }
    const pct = (hist, count, f) => {
      let acc = 0;
      for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc >= count * f) return i; }
      return 255;
    };
    const paperLevels = quad.map((h, i) => pct(h, qn[i], 0.9));
    return {
      paper: pct(paperHist, n, 0.9),
      dark: dark / n,
      chroma: chroma / n,
      levels: levels.size,
      spread: Math.max.apply(null, paperLevels) - Math.min.apply(null, paperLevels),
      quadPaper: paperLevels
    };
  }
})();
</script>
</body>
</html>
